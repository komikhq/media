name: Deploy CORS Generator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/cors-generator/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-cors-generator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate site URL
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.VITE_SITE_URL;
          if (!value) {
            throw new Error("Set the VITE_SITE_URL repository Actions variable to the site's HTTPS origin.");
          }

          const url = new URL(value);
          if (url.protocol !== "https:" || url.origin !== value) {
            throw new Error("VITE_SITE_URL must be an HTTPS origin without a trailing slash or path.");
          }
          NODE
      - run: pnpm --filter @komikhq/cors-generator build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/cors-generator/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
